<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b2414">
</head>
<body>
    <main>
        <h2>My Books</h2>
        <input type="file" id="pdfPicker" accept="application/pdf" multiple>
        <input type="text" id="searchInput" placeholder="Search books...">
        <p id="emptyMessage">Your shelf is empty. Tap Choose File to add a PDF.</p>
        <div class="library"></div>
    </main>

    <div id="reader" class="reader hidden">
    <div class="reader-body">
        <canvas id="pdfCanvas"></canvas>
        <div id="textView" class="text-view hidden"></div>
    </div>

    <div id="topBar" class="bar top-bar hidden">
        <button id="closeReader">←</button>
        <div id="readerTitle"></div>
        <button id="menuToggle">⋯</button>
    </div>

   <div id="menuPanel" class="menu-panel hidden">
        <button id="zoomOut">−</button>
        <button id="zoomIn">+</button>
        <button id="textToggle">Aa</button>
        <button id="themeToggle">Theme</button>
        <a id="downloadLink">⬇ Download</a>
    </div>

    <div id="bottomBar" class="bar bottom-bar hidden">
        <span id="pageInfo"></span>
        <input type="range" id="pageSlider" min="1" max="1" value="1">
    </div>

    <div id="progressLine"><div id="progressFill"></div></div>
 </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
